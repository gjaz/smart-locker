name: SmartLocker Frontend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/gjaz/smartlocker-ui:${{ github.sha }} \
            -t ghcr.io/gjaz/smartlocker-ui:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/gjaz/smartlocker-ui:${{ github.sha }}
          docker push ghcr.io/gjaz/smartlocker-ui:latest